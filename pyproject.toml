[project]
name = "web-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=45.0.0",
    # sshtunnel 0.4 usa paramiko.DSSKey, que se eliminó en paramiko 4
    "paramiko>=3.5,<4",
    "psycopg[binary]>=3.2.10",
    "pyotp>=2.9.0",
    "python-dotenv>=1.1.0",
    "qrcode[pil]>=8.2",
    "requests==2.33.0",
    "sqlalchemy>=2.0.40",
    "sshtunnel>=0.4.0",
    "streamlit>=1.66.1",
]

[project.scripts]
web-app = "web_app:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
